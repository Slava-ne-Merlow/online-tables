databaseChangeLog:
  - changeSet:
      id: 13-cascade-columns-side-fk
      author: codex
      changes:
        - dropForeignKeyConstraint:
            baseTableName: columns
            constraintName: fk_columns_side
        - addForeignKeyConstraint:
            baseTableName: columns
            baseColumnNames: side_id
