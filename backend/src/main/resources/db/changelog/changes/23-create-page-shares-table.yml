databaseChangeLog:
  - changeSet:
      id: 23-create-page-shares-table
      author: codex
      changes:
        - createTable:
            tableName: page_shares
            columns:
              - column:
                  name: page_id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: token
                  type: UUID
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: page_shares
            baseColumnNames: page_id
            referencedTableName: pages
            referencedColumnNames: id
            constraintName: fk_page_shares_page
            onDelete: CASCADE
