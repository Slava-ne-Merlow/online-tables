databaseChangeLog:
  - changeSet:
      id: 8.1-cells-one-of-check
      author: Mstislav_the
      preConditions:
        - dbms:
            type: postgresql
      changes:
        - sql:
            splitStatements: false
            endDelimiter: ;
            sql: |
              ALTER TABLE cells
              ADD CONSTRAINT chk_cells_one_value
              CHECK (
                (
                  (value_text   IS NOT NULL)::int +
                  (value_number IS NOT NULL)::int +
                  (value_date   IS NOT NULL)::int +
                  (option_id    IS NOT NULL)::int +
                  (file_id      IS NOT NULL)::int
                ) <= 1
              );
